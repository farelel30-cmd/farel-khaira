<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memories — Our Love Sanctuary</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="logo">
      Our Love Sanctuary
    </div>

    <div class="menu">
      ☰
    </div>

    <div class="nav-links">
      <a href="index.html">Our Sanctuary</a>
      <a href="journey.html">Our Journey</a>
      <a href="letters.html">Love Letters</a>
      <a href="memories.html" class="active">Memories</a>
      <a href="growth.html">Our Growth</a>
      <a href="songs.html">Our Songs</a>
    </div>
  </nav>


  <!-- MEMORIES -->
  <main>

    <section id="memories">

      <div class="section-heading">
        <span>OUR MEMORIES</span>

        <h1>Kenangan Kita</h1>

        <p>
          Beberapa momen kecil yang selalu ingin kita ingat.
        </p>
      </div>


      <!-- 6 FOTO HALAMAN 2 -->
      <div class="gallery" id="gallery"></div>


      <!-- NAVIGASI HALAMAN -->
      <div class="memory-navigation">

        <a href="memories.html" class="memory-nav-btn">
          ← Previous
        </a>

        <span class="memory-page-number">
          2 / 2
        </span>

      </div>

    </section>

  </main>


  <!-- PHOTO MODAL -->
  <div class="photo-modal" id="photoModal">

    <button
      class="photo-close"
      data-photo-close>
      ×
    </button>

    <div class="photo-modal-content">

      <img
        id="memoryPhoto"
        src=""
        alt="Memory">

      <p id="photoCaption"></p>

    </div>

  </div>


  <!-- SCRIPT -->
  <script>

    const memories = [
      'Bukber',
      'Hari Batik',
      'Serrae',
      'Playground',
      'Pulang Bareng',
      'Awan Costa'
    ];


    const gallery = document.getElementById('gallery');


    memories.forEach((name, i) => {

      const el = document.createElement('article');

      el.className = 'memory';


      el.innerHTML = `
        <div class="memory-content">

          <b>${name}</b>

          <span>
            memory ${String(i + 7).padStart(2, '0')} · click to view
          </span>

        </div>
      `;


      el.onclick = () => openPhoto(name);


      gallery.appendChild(el);

    });


    function openPhoto(name) {

      document.getElementById('photoCaption').textContent = name;

      document
        .getElementById('photoModal')
        .classList.add('show');

    }


    function closePhoto() {

      document
        .getElementById('photoModal')
        .classList.remove('show');

    }


    document
      .querySelector('[data-photo-close]')
      .onclick = closePhoto;


    document.addEventListener('keydown', (e) => {

      if (e.key === 'Escape') {
        closePhoto();
      }

    });

  </script>

</body>
</html>
