<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memories — Our Love Sanctuary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg">
  <i></i>
  <i></i>
  <i></i>
  <i></i>
  <i></i>
</div>

<header class="nav">

  <a href="index.html#home" class="brand">
    <span>♡</span> Our Love Sanctuary
  </a>

  <button class="menu" aria-label="menu">☰</button>

  <nav>
    <a href="index.html#home">Our Sanctuary</a>
    <a href="index.html#journey">Our Journey</a>
    <a href="index.html#letters">Love Letters</a>
    <a href="index.html#memories" class="active">Memories</a>
    <a href="index.html#growth">Our Growth</a>
    <a href="index.html#songs">Our Songs</a>
  </nav>

</header>


<main>

<section id="memories" class="page">

  <div class="heading">

    <div class="tiny">
      OUR FAVORITE MOMENTS
    </div>

    <h2>
      Memories
    </h2>

    <p>
      Beberapa momen yang layak disimpan selamanya.
    </p>

  </div>


  <div class="gallery" id="gallery"></div>


  <div class="memory-navigation">

    <a
      href="index.html#memories"
      class="memory-nav-btn"
    >
      ← Previous
    </a>

    <span class="memory-page-number">
      2 / 2
    </span>

  </div>

</section>

</main>


<!-- PHOTO MODAL -->

<div class="photo-modal" id="photoModal">

  <button
    class="x"
    data-photo-close
  >
    ×
  </button>

  <div
    class="photo-placeholder"
    id="photoView"
  ></div>

  <p id="photoCaption"></p>

</div>


<script>

const memories = [
  'Bukber',
  'Hari Batik',
  'Serrae',
  'Playground',
  'Pulang Bareng',
  'Awan Costa'
];


const gallery = document.getElementById('gallery');


memories.forEach((name, i) => {

  const el = document.createElement('article');

  el.className = 'memory';

  el.innerHTML = `
    <div class="memory-content">

      <b>${name}</b>

      <span>
        memory ${String(i + 7).padStart(2, '0')} · click to view
      </span>

    </div>
  `;

  el.onclick = () => openPhoto(name);

  gallery.appendChild(el);

});


function openPhoto(name) {

  document.getElementById('photoCaption').textContent = name;

  document
    .getElementById('photoModal')
    .classList.add('show');

}


function closePhoto() {

  document
    .getElementById('photoModal')
    .classList.remove('show');

}


document
  .querySelector('[data-photo-close]')
  .onclick = closePhoto;


document.addEventListener('keydown', (e) => {

  if (e.key === 'Escape') {

    closePhoto();

  }

});


/* MOBILE MENU */

document
  .querySelector('.menu')
  .onclick = () => {

    document
      .querySelector('nav')
      .classList.toggle('open');

  };

</script>

</body>
</html>
