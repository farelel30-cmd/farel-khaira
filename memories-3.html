
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memories — Page 3</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    .memories-three {
      width: min(1100px, 90%);
      margin: 0 auto;
      padding: 140px 0 80px;
    }

    .memories-three .heading {
      text-align: center;
      margin-bottom: 45px;
    }

    .memories-three .heading h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(42px, 7vw, 68px);
      margin: 12px 0;
      color: #fff;
    }

    .memories-three .heading p {
      color: #c5bdd8;
      line-height: 1.8;
    }

    .memory-grid-three {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 25px;
    }

    .memory-card-three {
      overflow: hidden;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(220, 170, 255, 0.2);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    .memory-card-three:hover {
      transform: translateY(-7px);
      border-color: rgba(255, 160, 225, 0.7);
    }

    .memory-card-three img {
      display: block;
      width: 100%;
      height: 320px;
      object-fit: cover;
      object-position: center;
    }

    .memory-info-three {
      padding: 18px;
    }

    .memory-info-three span {
      display: block;
      color: #dca8ff;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .memory-info-three h2 {
      color: #fff;
      font-family: 'Cormorant Garamond', serif;
      font-size: 25px;
      margin: 0;
    }

    .memory-info-three p {
      color: #bdb5ce;
      font-size: 12px;
      margin-bottom: 0;
    }

    .memory-pages-three {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 45px;
    }

    .memory-pages-three a {
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(220, 170, 255, 0.35);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 30px;
      padding: 12px 22px;
      transition: 0.3s ease;
    }

    .memory-pages-three a:hover {
      background: rgba(190, 120, 255, 0.2);
      border-color: #dca8ff;
    }

    .memory-pages-three .current {
      background: linear-gradient(135deg, #bd82f6, #f09acb);
      color: #170e24;
      font-weight: 700;
    }

    .photo-modal-three {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 25px;
      background: rgba(5, 4, 12, 0.94);
    }

    .photo-modal-three.show {
      display: flex;
    }

    .photo-modal-three img {
      max-width: 92vw;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(205, 130, 255, 0.18);
    }

    .photo-modal-three p {
      color: #fff;
      text-align: center;
      margin-top: 15px;
    }

    .photo-modal-three button {
      position: absolute;
      top: 22px;
      right: 25px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 38px;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .memory-grid-three {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
      }

      .memory-card-three img {
        height: 260px;
      }

      .memories-three {
        padding-top: 110px;
      }
    }

    @media (max-width: 480px) {
      .memory-grid-three {
        grid-template-columns: 1fr;
      }

      .memory-card-three img {
        height: 350px;
      }

      .memories-three {
        width: 88%;
      }
    }
  </style>
</head>

<body>
  <div class="bg">
    <i></i><i></i><i></i><i></i><i></i>
  </div>

  <header class="nav">
    <a href="index.html#home" class="brand">
      <span>♡</span> Our Love Sanctuary
    </a>

    <button class="menu" aria-label="Buka menu">☰</button>

    <nav>
      <a href="index.html#home">Our Sanctuary</a>
      <a href="index.html#journey">Our Journey</a>
      <a href="index.html#letters">Love Letters</a>
      <a href="index.html#memories">Memories</a>
      <a href="index.html#growth">Our Growth</a>
      <a href="index.html#songs">Our Songs</a>
    </nav>
  </header>

  <main class="memories-three">
    <div class="heading">
      <div class="tiny">OUR LITTLE UNIVERSE ♡</div>
      <h1>More Memories</h1>
      <p>Enam momen lagi yang ingin kita simpan di tempat kecil ini.</p>
    </div>

    <div class="memory-grid-three" id="memoryGridThree"></div>

    <div class="memory-pages-three">
      <a href="memories-2.html">← Previous</a>
      <a href="index.html#memories">1</a>
      <a href="memories-2.html">2</a>
      <a href="memories-3.html" class="current">3</a>
    </div>
  </main>

  <div class="photo-modal-three" id="photoModalThree">
    <button id="closePhotoThree" aria-label="Tutup foto">×</button>
    <img id="largePhotoThree" src="" alt="">
    <p id="captionPhotoThree"></p>
  </div>

  <script src="script.js"></script>

  <script>
    const memoriesThree = [
      {
        name: 'Ultah aku ke 17',
        image: 'memory13.jpeg'
      },
      {
        name: 'photobooth di bento',
        image: 'memory14.jpeg'
      },
      {
        name: 'photobooth di anak panah kopi',
        image: 'memory15.jpeg'
      },
      {
        name: 'Jogging undip',
        image: 'memory16.jpeg'
      },
      {
        name: 'photobooth di serrae',
        image: 'memory17.jpeg'
      },
      {
        name: 'photobooth di kota lama',
        image: 'memory18.jpeg'
      }
    ];

    const memoryGridThree = document.getElementById('memoryGridThree');
    const photoModalThree = document.getElementById('photoModalThree');
    const largePhotoThree = document.getElementById('largePhotoThree');
    const captionPhotoThree = document.getElementById('captionPhotoThree');

    memoriesThree.forEach((memory, index) => {
      const card = document.createElement('article');
      card.className = 'memory-card-three';

      const image = document.createElement('img');
      image.src = memory.image;
      image.alt = memory.name;
      image.loading = 'lazy';

      const info = document.createElement('div');
      info.className = 'memory-info-three';

      const number = document.createElement('span');
      number.textContent = 'MEMORY ' + String(index + 13).padStart(2, '0');

      const title = document.createElement('h2');
      title.textContent = memory.name;

      const hint = document.createElement('p');
      hint.textContent = 'Click to view full photo ♡';

      info.append(number, title, hint);
      card.append(image, info);
      memoryGridThree.appendChild(card);

      card.addEventListener('click', () => {
        largePhotoThree.src = memory.image;
        largePhotoThree.alt = memory.name;
        captionPhotoThree.textContent = memory.name;
        photoModalThree.classList.add('show');
      });
    });

    document.getElementById('closePhotoThree').addEventListener('click', () => {
      photoModalThree.classList.remove('show');
      largePhotoThree.src = '';
    });

    photoModalThree.addEventListener('click', event => {
      if (event.target === photoModalThree) {
        photoModalThree.classList.remove('show');
        largePhotoThree.src = '';
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        photoModalThree.classList.remove('show');
        largePhotoThree.src = '';
      }
    });
  </script>
</body>
</html>
